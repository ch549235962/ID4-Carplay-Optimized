name: Attach Windows installer to draft release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build vehicle installer run ID
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        default: v0.2.0
        type: string
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate source run and draft destination
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run_id=os.environ['RUN_ID'];tag=os.environ['RELEASE_TAG'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[0-9]+',run_id) and re.fullmatch(r'v[0-9][A-Za-z0-9._-]*',tag)
          def api(path):return json.loads(subprocess.check_output(['gh','api',path]))
          run=api(f'repos/{repo}/actions/runs/{run_id}')
          release=next(r for r in api(f'repos/{repo}/releases?per_page=100') if r['tag_name']==tag)
          assert run['name']=='Build vehicle installer' and run['conclusion']=='success'
          assert run['head_repository']['full_name']==repo and run['head_branch']=='main'
          assert release['draft'] is True and release['target_commitish']==run['head_sha']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ID4-CarPlay-Windows-x64
          path: installer
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Attach verified build without executing the executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd installer
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=Path('windows-SHA256SUMS.txt').read_text(encoding='utf-8-sig').split()[0]
          assert hashlib.sha256(Path('ID4-CarPlay-Installer.exe').read_bytes()).hexdigest()==expected
          report=json.loads(Path('windows-selftest.json').read_text(encoding='utf-8-sig'))
          assert report['ok'] is True and report['network_used'] is False and report['platform']=='win32'
          PY
          gh release upload "$RELEASE_TAG" ID4-CarPlay-Installer.exe windows-selftest.json --repo "$GITHUB_REPOSITORY"
