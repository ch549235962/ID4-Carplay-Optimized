name: Build vehicle installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'vehicle_installer/**'
      - '.github/workflows/build-vehicle-installer.yml'
permissions:
  contents: read
jobs:
  windows:
    name: Windows x64 app and fault-injection tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: vehicle_installer/requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r vehicle_installer/requirements-build.txt
      - name: Transaction and protocol tests (isolated filesystem)
        run: python -m unittest discover -s vehicle_installer/tests -v
      - name: Build native Windows executable
        run: python -m vehicle_installer.build
      - name: Smoke test packaged executable without a network connection
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/windows-selftest.json'
          $process = Start-Process -FilePath '.\dist\ID4-CarPlay-Installer.exe' -ArgumentList @('--self-test','--report',$report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }
          if (!(Test-Path $report)) { throw 'Packaged self-test did not write its report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.ok -or $result.network_used) { throw 'Invalid packaged self-test result' }
          Get-Content $report
          (Get-FileHash 'dist/ID4-CarPlay-Installer.exe' -Algorithm SHA256).Hash.ToLower() + '  ID4-CarPlay-Installer.exe' | Out-File -FilePath dist/windows-SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ID4-CarPlay-Windows-x64
          path: |
            dist/ID4-CarPlay-Installer.exe
            dist/windows-selftest.json
            dist/windows-SHA256SUMS.txt
